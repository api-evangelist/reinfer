name: Reinfer
description: >-
  Reinfer was a London-based communications intelligence company, backed by Seedcamp, that built a
  natural-language-processing platform for mining structured insight and automation triggers from
  unstructured conversational data such as emails, support tickets, and chat. Reinfer was acquired by
  SS&C Blue Prism and its technology folded into SS&C's intelligent-automation product line; the
  original developer surface (reinfer.io, docs.reinfer.io, api.reinfer.io) is now defunct and no
  longer resolves, so there is no live public API to catalog. This profile is retained as a portfolio
  and acquisition lead for the API Evangelist network.
